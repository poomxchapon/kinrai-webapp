<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กินไร - รวมร้านลับทั่วไทย</title>
    <!-- Import Google Fonts: Mali -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Import Leaflet CSS (สำหรับแผนที่) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        :root {
            --primary: #FF9A9E;
            --secondary: #FECFEF;
            --accent: #FBC2EB;
            --text: #4A4A4A;
            --bg: #FFF6F9;
            --card-bg: #FFFFFF;
            --map-border: #FFB7B2;
        }

        body {
            font-family: 'Mali', cursive;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.1);
            margin: 0;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #888;
            margin-top: 5px;
        }

        /* Controls Section */
        .controls-container {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            border: 2px solid var(--secondary);
        }

        select {
            font-family: 'Mali', cursive;
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid var(--primary);
            background-color: white;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            min-width: 150px;
        }

        .action-btn {
            background: linear-gradient(45deg, #FF9A9E, #FBC2EB);
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-family: 'Mali', cursive;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 5px 10px rgba(255, 154, 158, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.secondary {
            background: linear-gradient(45deg, #A0E7E5, #B4F8C8);
            box-shadow: 0 5px 10px rgba(160, 231, 229, 0.4);
            color: #00695C;
        }

        /* Map Container */
        #map {
            height: 400px;
            width: 100%;
            max-width: 1200px;
            border-radius: 20px;
            border: 4px solid var(--map-border);
            margin-bottom: 30px;
            z-index: 1; /* Ensure map stays below fixed elements if any */
        }

        .status {
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
        }

        /* Card Container */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* Card Style */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 3px solid #FFF;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
            z-index: 10;
        }

        .card-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #FFE5B4;
            color: #E67E22;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .card h3 {
            margin: 0 0 5px 0;
            color: var(--primary);
            font-size: 1.3rem;
        }

        .card .location {
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card .desc {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #666;
            margin-bottom: 15px;
            background: #F9F9F9;
            padding: 10px;
            border-radius: 10px;
            flex-grow: 1;
        }

        .nav-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #A0E7E5;
            color: #00695C;
            text-decoration: none;
            padding: 10px 0;
            border-radius: 12px;
            font-weight: bold;
            margin-top: auto;
            transition: background 0.2s;
            cursor: pointer;
            border: none;
            font-family: 'Mali', cursive;
            font-size: 1rem;
        }

        .nav-btn:hover {
            background-color: #7CD1D0;
        }

        .distance-tag {
            font-size: 0.8rem;
            color: #FF9A9E;
            margin-left: auto;
            font-weight: bold;
        }

        /* Leaflet Popup Style Customization */
        .leaflet-popup-content-wrapper {
            border-radius: 15px;
            font-family: 'Mali', cursive;
        }
        .leaflet-popup-content b {
            color: var(--primary);
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .card-container { grid-template-columns: 1fr; }
            .controls-container { flex-direction: column; align-items: stretch; }
            #map { height: 300px; }
        }
    </style>
</head>
<body>

    <header>

        <p class="subtitle">รวมร้านลับ 77 จังหวัด ฉบับคนพื้นที่</p>

    <div class="controls-container">
        <select id="regionFilter" onchange="updateProvinceFilter()">

            <option value="ตะวันออก">ภาคตะวันออก</option>
            <option value="ตะวันตก">ภาคตะวันตก</option>
            <option value="ใต้">ภาคใต้</option>
        </select>
        
        <select id="provinceFilter" onchange="applyFilters()">
            <option value="">📍 ทุกจังหวัด</option>
        </select>

        <button class="action-btn" onclick="getLocation()">
            📡 ร้านใกล้ฉัน
        </button>
        
        <button class="action-btn secondary" onclick="resetFilters()">
            🔄 รีเซ็ต

    <div id="status" class="status"></div>

    <div id="map"></div>

    <div id="results" class="card-container">

        // Helper: หาว่าจังหวัดอยู่ภาคไหน
        function getRegionByProvince(province) {
            for (const [region, provinces] of Object.entries(regionMap)) {
                if (provinces.includes(province)) return region;
            }
            return "";
        }

        // เพิ่มข้อมูล Region เข้าไปใน Database
        database.forEach(item => {
            item.region = getRegionByProvince(item.province);
        });

        function updateProvinceFilter() {
            const selectedRegion = regionFilter.value;
            provinceFilter.innerHTML = '<option value="">📍 ทุกจังหวัด</option>';

            let provincesToShow = [];
            if (selectedRegion) {
                provincesToShow = regionMap[selectedRegion];
            } else {
                // ถ้าไม่เลือกภาค ให้โชว์ทุกจังหวัด (เรียงตามชื่อ)
                provincesToShow = Object.values(regionMap).flat().sort();

                option.value = prov;
                option.textContent = prov;
                provinceFilter.appendChild(option);
            });

            applyFilters();
        }

        function applyFilters() {
            const r = regionFilter.value;
            const p = provinceFilter.value;

            let filtered = database;

            if (r) filtered = filtered.filter(item => item.region === r);
            if (p) filtered = filtered.filter(item => item.province === p);

            renderCards(filtered);
            updateMap(filtered);

            // Zoom map to selected province/region area if possible
            if (p && provinceCoords[p]) {
                map.flyTo([provinceCoords[p].lat, provinceCoords[p].lng], 10);
            } else if (r) {
                // Zoom out a bit if only region selected
                map.flyTo([13.7563, 100.5018], 6); 
            }
        }

        function resetFilters() {
            regionFilter.value = "";
            updateProvinceFilter(); // จะเคลียร์จังหวัดด้วย
            applyFilters();
            map.flyTo([13.7563, 100.5018], 6);
            statusDiv.textContent = "";
        }

        function getLocation() {
            statusDiv.textContent = "กำลังค้นหาตำแหน่งของคุณ... 🛰️";

                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                statusDiv.textContent = "Geolocation is not supported by this browser.";
            }
        }

        function showPosition(position) {
            const lat1 = position.coords.latitude;
            const lon1 = position.coords.longitude;
            
            statusDiv.textContent = "เจอตำแหน่งแล้ว! กำลังเรียงลำดับร้านใกล้คุณ... 🚀";

            // Add User Marker
            L.marker([lat1, lon1]).addTo(map)
                .bindPopup("<b>🏠 คุณอยู่ที่นี่</b>").openPopup();
            map.flyTo([lat1, lon1], 9);

            // Sort Data
            const sortedData = [...database].map(item => {
                const coords = provinceCoords[item.province];
                let dist = 9999;
                if (coords) {
                    dist = calculateDistance(lat1, lon1, coords.lat, coords.lng);
                }
                return { ...item, distance: dist };
            }).sort((a, b) => a.distance - b.distance);

            // รีเซ็ต Filter เพื่อโชว์ผลลัพธ์ที่ Sort แล้วทั้งหมด
            regionFilter.value = "";
            updateProvinceFilter();
            renderCards(sortedData, true);
        }

        function showError(error) {
            statusDiv.textContent = "ไม่สามารถระบุตำแหน่งได้ (ลองกดอนุญาตดูนะ!)";
        }

        // Haversine Formula
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Render Cards
        function renderCards(data, showDistance = false) {
            resultsDiv.innerHTML = "";
            if (data.length === 0) {
                resultsDiv.innerHTML = "<div style='width:100%; text-align:center; color:#888;'>ไม่พบข้อมูลร้านค้าในหมวดที่เลือก</div>";
                return;
            }

            data.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                
                let distHtml = "";
                if (showDistance && item.distance !== undefined && item.distance < 9000) {
                    distHtml = `<span class="distance-tag">📍 ห่าง ~${item.distance.toFixed(0)} กม.</span>`;
                }

                card.innerHTML = `
                    <div class="card-badge">${item.province}</div>
                    <h3>${item.name}</h3>
                    <div class="location">
                        <span>🗺️ ${item.province}</span>
                        ${distHtml}
                    </div>
                    <div class="desc">${item.desc}</div>
                    <button class="nav-btn" onclick="openMap('${item.name}', '${item.province}')">
                        🚀 ไปร้านนี้เลย!
                    </button>
                `;
                resultsDiv.appendChild(card);
            });
        }

        // Update Map Markers
        function updateMap(data) {
            markersLayer.clearLayers();
            
            data.forEach(item => {
                const coords = provinceCoords[item.province];
                if (coords) {
                    // Jitter: Add random offset so markers don't stack exactly on top of each other
                    // 0.05 deg is roughly 5km
                    const jitterLat = coords.lat + (Math.random() - 0.5) * 0.08; 
                    const jitterLng = coords.lng + (Math.random() - 0.5) * 0.08;

                    const marker = L.marker([jitterLat, jitterLng]);
                    
                    const popupContent = `
                        <b>${item.name}</b><br>
                        ${item.province}<br>
                        <a href="#" onclick="openMap('${item.name}', '${item.province}')">นำทางไปที่นี่</a>
                    `;
                    
                    marker.bindPopup(popupContent);
                    markersLayer.addLayer(marker);
                }
            });
        }

        function openMap(name, province) {
            // ใช้ Google Maps Direction API เพื่อเปิดโหมดนำทางทันที
            const destination = encodeURIComponent(`${name} ${province}`);
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${destination}`, '_blank');
        }
    </script>
